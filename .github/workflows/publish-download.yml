name: Publish Skill Download

on:
  push:
    branches:
      - main
    paths:
      - "skills/vps-proxy-node-setup/**"
      - ".github/workflows/publish-download.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-skill-download
  cancel-in-progress: true

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run offline checks
        shell: bash
        run: |
          if ! skills/vps-proxy-node-setup/tests/test_static.sh; then
            bash -x skills/vps-proxy-node-setup/tests/test_static.sh
            exit 1
          fi

      - name: Build verified download package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          git archive --format=zip --prefix=vps-node-setup/ \
            --output=public/vps-node-setup.zip \
            HEAD:skills/vps-proxy-node-setup
          (
            cd public
            sha256sum vps-node-setup.zip
          ) > public/vps-node-setup.zip.sha256
          cat > public/install-vps-node-setup.sh <<'EOF'
          #!/usr/bin/env bash
          # Downloads, verifies, and extracts the Skill without requiring unzip.
          set -Eeuo pipefail

          base_url='https://vps-node-download.pages.dev'
          target_dir="${1:-$PWD}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          command -v curl >/dev/null 2>&1 || {
            echo 'curl is required to download the verified Skill package.' >&2
            exit 1
          }
          command -v sha256sum >/dev/null 2>&1 || {
            echo 'sha256sum is required to verify the Skill package.' >&2
            exit 1
          }

          curl -fsSL "$base_url/vps-node-setup.zip" -o "$work_dir/vps-node-setup.zip"
          curl -fsSL "$base_url/vps-node-setup.zip.sha256" -o "$work_dir/vps-node-setup.zip.sha256"
          (cd "$work_dir" && sha256sum -c vps-node-setup.zip.sha256)

          mkdir -p "$target_dir"
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "$work_dir/vps-node-setup.zip" -d "$target_dir"
          elif command -v python3 >/dev/null 2>&1; then
            python3 - "$work_dir/vps-node-setup.zip" "$target_dir" <<'PY'
          import sys
          import zipfile
          zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])
          PY
          elif command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            echo 'Installing unzip to extract the verified Skill package...'
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y unzip
            unzip -q "$work_dir/vps-node-setup.zip" -d "$target_dir"
          else
            echo 'Need unzip or python3 to extract the verified Skill package.' >&2
            echo 'On Debian/Ubuntu, run this installer as root to allow automatic unzip installation.' >&2
            exit 1
          fi

          printf 'Skill extracted to: %s/vps-node-setup\n' "$target_dir"
          printf 'Run deployment scripts with: bash scripts/deploy.sh <command>\n'
          EOF
          chmod +x public/install-vps-node-setup.sh
          (
            cd public
            sha256sum install-vps-node-setup.sh
          ) > public/install-vps-node-setup.sh.sha256
          {
            printf 'GitHub repository: %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
            printf 'Archive root: vps-node-setup/\n'
          } > public/SOURCE-COMMIT.txt
          cat > public/_headers <<'EOF'
          /vps-node-setup.zip
            Cache-Control: no-store
          /vps-node-setup.zip.sha256
            Cache-Control: no-store
          /install-vps-node-setup.sh
            Cache-Control: no-store
          /install-vps-node-setup.sh.sha256
            Cache-Control: no-store
          /SOURCE-COMMIT.txt
            Cache-Control: no-store
          EOF

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=vps-node-download --branch=main
