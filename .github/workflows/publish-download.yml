name: Publish Skill Download

on:
  push:
    branches:
      - main
    paths:
      - "skills/vps-proxy-node-setup/**"
      - ".github/workflows/publish-download.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-skill-download
  cancel-in-progress: true

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install Minisign
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Run offline checks
        shell: bash
        run: |
          if ! skills/vps-proxy-node-setup/tests/test_static.sh; then
            bash -x skills/vps-proxy-node-setup/tests/test_static.sh
            exit 1
          fi

      - name: Build verified download package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          git archive --format=tar.gz --prefix=vps-node-setup/ \
            --output=public/vps-node-setup.tar.gz \
            HEAD:skills/vps-proxy-node-setup
          {
            printf 'GitHub repository: %s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            printf 'Source commit: %s\n' "${GITHUB_SHA}"
            printf 'Archive root: vps-node-setup/\n'
          } > public/SOURCE-COMMIT.txt
          cat > public/_headers <<'EOF'
          /vps-node-setup.tar.gz
            Cache-Control: no-store
          /vps-node-setup.tar.gz.minisig
            Cache-Control: no-store
          /SOURCE-COMMIT.txt
            Cache-Control: no-store
          EOF

      - name: Sign download artifacts
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${MINISIGN_SECRET_KEY}" ]] || {
            echo 'MINISIGN_SECRET_KEY is not configured.' >&2
            exit 1
          }
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "${MINISIGN_SECRET_KEY}" > "$key_file"
          chmod 0600 "$key_file"
          minisign -Sm public/vps-node-setup.tar.gz -s "$key_file"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=vps-node-download --branch=main
